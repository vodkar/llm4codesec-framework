version: '3.8'

services:
  llm4codesec-benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm4codesec-benchmark:latest
    container_name: llm4codesec-benchmark
    
    # GPU configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: 
              - gpu
              - utility # nvidia-smi
              - compute # CUDA
              - video
    
    environment:
      # Python settings
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      
      # Hugging Face cache (optional)
      - HF_HOME=/app/.cache/huggingface
      - VLLM_CACHE_ROOT=/app/.cache/huggingface

      # NOTE: CUDA_LAUNCH_BLOCKING serializes every CUDA kernel launch (debug
      # only) and cripples GPU throughput for both vLLM and llama.cpp. Keep 0.
      - CUDA_LAUNCH_BLOCKING=0
      # Spawn (not fork) vLLM engine-core workers. Mixed-backend plans load
      # llama.cpp/HF models in the parent process, which initializes CUDA
      # there; a forked EngineCore then dies with "CUDA error: initialization
      # error". Spawned workers start clean regardless of parent CUDA state.
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - LLAMA_CPP_FLASH_ATTN=1
      # Allocate sliding-window KV at window size instead of full n_ctx for
      # iSWA models (gemma-4: 25 of 30 layers are SWA). Saves ~4.3 GB VRAM at
      # 22k ctx, which is what lets gemma4-26b-a4b IQ4_XS fully offload on the
      # 16 GB card. No effect on models without SWA layers (qwen etc.).
      - LLAMA_CPP_SWA_FULL=0
      # Offload all model layers to the GPU. Without this llama.cpp defaults to
      # n_gpu_layers=0 (full CPU inference) — ~10-30x slower. -1 = all layers.
      - LLAMA_CPP_N_GPU_LAYERS=-1
      # Prompt-lookup speculative decoding (opt-in). DISABLED by default: it is
      # lossless and free, but llama-cpp-python 0.3.31 forces logits_all=True
      # when a draft model is set, which allocates an n_ctx*vocab float32 score
      # buffer on the HOST. For 262k-vocab models (gemma) at n_ctx=13k that is
      # ~13.6 GB RAM — does not fit this 15 GB host. Safe to enable only for
      # small-vocab models on a high-RAM host.
      - LLAMA_CPP_PROMPT_LOOKUP=0
      - LLAMA_CPP_DRAFT_MAX_NGRAM=3
      - LLAMA_CPP_DRAFT_PRED_TOKENS=10

    env_file:
      - .env
      
    volumes:
      # Persistent storage for results
      - ./results:/app/results
      - ./datasets_processed:/app/datasets_processed
      - ./benchmarks:/app/benchmarks
      
      # Optional: Cache directories for models (to avoid re-downloading)
      - /var/opt/torch_cache:/app/.cache/torch
      - /var/opt/huggingface_cache:/app/.cache/huggingface
      
      
    working_dir: /app
    
    # Network mode for better performance
    network_mode: host
    
    # Keep container running for interactive use
    tty: true
    stdin_open: true
    
    # Optional: Restart policy
    restart: unless-stopped

  # Alternative service for CPU-only benchmarks
  llm4codesec-benchmark-cpu:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: llm4codesec-benchmark:cpu
    container_name: llm4codesec-benchmark-cpu
    
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - CUDA_VISIBLE_DEVICES=""  # Disable CUDA
      
    volumes:
      - ./results:/app/results
      - ./datasets_processed:/app/datasets_processed
      - ./benchmarks:/app/benchmarks
      
    working_dir: /app
    mem_limit: 16g
    
    profiles:
      - cpu-only

networks:
  default:
    driver: bridge
